<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f7f9fc; stroke:#2f3a4a; stroke-width:1.3; rx:8; }
      .native { fill:#f0ecff; }
      .java { fill:#eaf7ee; }
      .text { font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; font-size:14px; fill:#1d2630; }
      .title { font-size:16px; font-weight:600; }
      .line { stroke:#333; stroke-width:1.4; marker-end:url(#arrow4); fill:none; }
    </style>
  </defs>

  <rect x="45" y="70" width="180" height="80" class="box native"/>
  <text x="70" y="104" class="text title">X server</text>
  <text x="70" y="129" class="text">root pixmap / cursor</text>

  <rect x="275" y="70" width="190" height="80" class="box native"/>
  <text x="300" y="104" class="text title">LorieBuffer</text>
  <text x="300" y="129" class="text">AHardwareBuffer / fd</text>

  <rect x="515" y="70" width="170" height="80" class="box native"/>
  <text x="540" y="104" class="text title">renderer thread</text>
  <text x="540" y="129" class="text">EGL / GLES</text>

  <rect x="735" y="70" width="180" height="80" class="box java"/>
  <text x="760" y="104" class="text title">LorieView</text>
  <text x="760" y="129" class="text">Android Surface</text>

  <rect x="275" y="225" width="410" height="65" class="box"/>
  <text x="300" y="262" class="text">无 Bitmap copy；Activity 只提供 Surface 生命周期</text>

  <path d="M225 110 L275 110" class="line"/>
  <path d="M465 110 L515 110" class="line"/>
  <path d="M685 110 L735 110" class="line"/>
  <path d="M825 150 C825 205 640 215 575 225" class="line"/>
</svg>
