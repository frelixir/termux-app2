<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f7f9fc; stroke:#2f3a4a; stroke-width:1.4; rx:8; }
      .app { fill:#e8f3ff; }
      .x11 { fill:#eaf7ee; }
      .bridge { fill:#fff3d9; }
      .text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; font-size:14px; fill:#1d2630; }
      .title { font-size:16px; font-weight:600; }
      .line { stroke:#333; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
      .dash { stroke:#777; stroke-width:1.3; stroke-dasharray:6 5; marker-end:url(#arrow); fill:none; }
    </style>
  </defs>
  <rect x="30" y="40" width="210" height="95" class="box app"/>
  <text x="55" y="75" class="text title">:app</text>
  <text x="55" y="102" class="text">TermuxActivity</text>
  <text x="55" y="124" class="text">TermuxService / 保活</text>

  <rect x="365" y="35" width="230" height="110" class="box x11"/>
  <text x="390" y="70" class="text title">:termux-x11</text>
  <text x="390" y="97" class="text">X11DisplayView / LorieView</text>
  <text x="390" y="119" class="text">Xlorie / EGL / Input</text>

  <rect x="690" y="35" width="230" height="110" class="box bridge"/>
  <text x="715" y="70" class="text title">:termux-wayland</text>
  <text x="715" y="97" class="text">package display bridge</text>
  <text x="715" y="119" class="text">termux-package 生态使用</text>

  <rect x="30" y="210" width="210" height="95" class="box"/>
  <text x="55" y="245" class="text title">terminal-view</text>
  <text x="55" y="272" class="text">TerminalView</text>

  <rect x="365" y="210" width="230" height="95" class="box"/>
  <text x="390" y="245" class="text title">terminal-emulator</text>
  <text x="390" y="272" class="text">PTY / TerminalSession</text>

  <rect x="690" y="210" width="230" height="95" class="box"/>
  <text x="715" y="245" class="text title">termux-shared</text>
  <text x="715" y="272" class="text">Shell / Constants / Utils</text>

  <path d="M240 88 C285 88 315 88 365 88" class="line"/>
  <path d="M135 210 L135 135" class="line"/>
  <path d="M240 258 C285 258 315 258 365 258" class="line"/>
  <path d="M595 258 C630 258 650 258 690 258" class="line"/>
  <path d="M805 145 C805 175 805 180 805 210" class="dash"/>
  <text x="625" y="168" class="text">协议概念可共享，app 主 UI 不依赖</text>
</svg>
