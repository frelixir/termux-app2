<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f7f9fc; stroke:#2f3a4a; stroke-width:1.3; rx:8; }
      .java { fill:#e8f3ff; }
      .x11 { fill:#eaf7ee; }
      .native { fill:#f0ecff; }
      .text { font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; font-size:14px; fill:#1d2630; }
      .title { font-size:16px; font-weight:600; }
      .line { stroke:#333; stroke-width:1.4; marker-end:url(#arrow5); fill:none; }
    </style>
  </defs>

  <rect x="50" y="80" width="170" height="80" class="box java"/>
  <text x="75" y="114" class="text title">Android input</text>
  <text x="75" y="139" class="text">touch / key / mouse</text>

  <rect x="270" y="80" width="190" height="80" class="box x11"/>
  <text x="295" y="114" class="text title">X11InputController</text>
  <text x="295" y="139" class="text">route / focus / transform</text>

  <rect x="510" y="80" width="170" height="80" class="box x11"/>
  <text x="535" y="114" class="text title">LorieView JNI</text>
  <text x="535" y="139" class="text">native input methods</text>

  <rect x="730" y="80" width="180" height="80" class="box native"/>
  <text x="755" y="114" class="text title">X server input</text>
  <text x="755" y="139" class="text">Queue*Events</text>

  <path d="M220 120 L270 120" class="line"/>
  <path d="M460 120 L510 120" class="line"/>
  <path d="M680 120 L730 120" class="line"/>
</svg>
