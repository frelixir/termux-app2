<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f7f9fc; stroke:#2f3a4a; stroke-width:1.3; }
      .hot { fill:#eaf7ee; }
      .ui { fill:#e8f3ff; }
      .text { font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; font-size:13px; fill:#1d2630; }
      .title { font-size:15px; font-weight:600; }
      .line { stroke:#333; stroke-width:1.4; marker-end:url(#arrow8); fill:none; }
    </style>
  </defs>

  <rect x="35" y="40" width="160" height="64" rx="8" class="box hot"/>
  <text x="55" y="68" class="text title">1. X11DisplayView</text>
  <text x="55" y="90" class="text">可嵌入控件</text>

  <rect x="230" y="40" width="160" height="64" rx="8" class="box hot"/>
  <text x="250" y="68" class="text title">2. Connector</text>
  <text x="250" y="90" class="text">binder / fd</text>

  <rect x="425" y="40" width="160" height="64" rx="8" class="box hot"/>
  <text x="445" y="68" class="text title">3. InputCtrl</text>
  <text x="445" y="90" class="text">输入路由</text>

  <rect x="620" y="40" width="160" height="64" rx="8" class="box hot"/>
  <text x="640" y="68" class="text title">4. DisplayCtrl</text>
  <text x="640" y="90" class="text">状态 / overlay</text>

  <rect x="815" y="40" width="130" height="64" rx="8" class="box ui"/>
  <text x="835" y="68" class="text title">5. app 组合</text>
  <text x="835" y="90" class="text">移除继承</text>

  <rect x="35" y="175" width="180" height="64" rx="8" class="box ui"/>
  <text x="55" y="203" class="text title">6. MainSurface</text>
  <text x="55" y="225" class="text">Terminal / Display 共享</text>

  <rect x="250" y="175" width="170" height="64" rx="8" class="box ui"/>
  <text x="270" y="203" class="text title">7. Drawer lock</text>
  <text x="270" y="225" class="text">Display 模式禁边缘拖拽</text>

  <rect x="455" y="175" width="175" height="64" rx="8" class="box"/>
  <text x="475" y="203" class="text title">8. SlidingWindow</text>
  <text x="475" y="225" class="text">去静态依赖 / 下线</text>

  <rect x="665" y="175" width="160" height="64" rx="8" class="box"/>
  <text x="685" y="203" class="text title">9. LorieView</text>
  <text x="685" y="225" class="text">host / prefs 注入</text>

  <rect x="355" y="320" width="170" height="64" rx="8" class="box"/>
  <text x="375" y="348" class="text title">10. Service owner</text>
  <text x="375" y="370" class="text">Activity 重建恢复</text>

  <rect x="560" y="320" width="190" height="64" rx="8" class="box"/>
  <text x="580" y="348" class="text title">11. MainActivity wrapper</text>
  <text x="580" y="370" class="text">standalone/debug</text>

