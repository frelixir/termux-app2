  <text x="715" y="259" class="arch7_text">ACTION_START broadcast</text>
  <text x="715" y="279" class="arch7_text">ICmdEntryInterface binder</text>

  <rect x="690" y="340" width="230" height="58" rx="8" class="arch7_box arch7_x11"/>
  <text x="715" y="376" class="arch7_text">MainActivity receiver</text>
  <rect x="410" y="340" width="230" height="58" rx="8" class="arch7_box"/>
  <text x="435" y="376" class="arch7_text">binder.getXConnection()</text>
  <rect x="155" y="340" width="205" height="58" rx="8" class="arch7_box arch7_x11"/>
  <text x="180" y="376" class="arch7_text">LorieView.connect(fd)</text>

