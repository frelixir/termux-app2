  <text x="500" y="81" class="arch7_text">shell-loader.apk</text>
  <rect x="690" y="45" width="165" height="58" rx="8" class="arch7_box"/>
  <text x="715" y="81" class="arch7_text">Loader.main()</text>

  <rect x="690" y="140" width="230" height="58" rx="8" class="arch7_box"/>
