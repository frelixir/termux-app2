<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <defs>
    <marker id="arch7_arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .arch7_box { fill:#f7f9fc; stroke:#2f3a4a; stroke-width:1.3; }
      .arch7_shell { fill:#e8f3ff; }
      .arch7_x11 { fill:#eaf7ee; }
      .arch7_native { fill:#f0ecff; }
      .arch7_text { font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; font-size:14px; fill:#1d2630; }
      .arch7_title { font-size:16px; font-weight:600; }
      .arch7_line { stroke:#333; stroke-width:1.4; marker-end:url(#arch7_arrow); fill:none; }
    </style>
  </defs>
  <rect x="35" y="45" width="150" height="58" rx="8" class="arch7_box arch7_shell"/>
