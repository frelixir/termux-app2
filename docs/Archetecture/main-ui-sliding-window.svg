  <rect x="655" y="95" width="250" height="115" rx="8" class="arch2_panel arch2_right"/>
  <text x="680" y="130" class="arch2_text arch2_title">right</text>
  <text x="680" y="158" class="arch2_text">window_preference.xml</text>
